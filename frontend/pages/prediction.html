<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <title>Konfigurasi Prediksi — NapasLoka</title>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/index.html">NapasLoka</a>
    <nav class="nav" aria-label="Navigasi utama">
      <a href="/index.html">Beranda</a><a href="/pages/prediction.html" aria-current="page">Konfigurasi Prediksi</a><a href="/pages/evaluation.html">Grafik & Evaluasi</a><a href="/pages/interpretation.html">Interpretasi</a><a href="/pages/information.html">Informasi</a>
    </nav>
  </header>
  <main>
    <h1>Konfigurasi Prediksi</h1>
    <p class="lead">Pilihan berasal dari konfigurasi dan artefak sistem; tidak ada input koordinat, konsentrasi, atau meteorologi manual.</p>
    <form id="prediction-form" class="panel">
      <div class="form-grid">
        <label>Lokasi<select name="location" required></select></label>
        <label>Polutan<select name="pollutant" required></select></label>
        <label>Skenario<select name="scenario" required></select></label>
        <label>Algoritma<select name="algorithm" required></select></label>
        <label>Mulai<input name="start_datetime" type="datetime-local"></label>
        <label>Selesai<input name="end_datetime" type="datetime-local"></label>
      </div>
      <p><button type="submit">Minta prediksi</button></p>
      <div id="prediction-status" class="status" role="status">Menunggu konfigurasi API.</div>
    </form>
  </main>
  <script src="/js/app.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/prediction.js" defer></script>
</body>
</html>
