# Single source of truth untuk schema fitur. Nama fitur konkret dibentuk oleh
# ml_pipeline.features.scenarios dari konfigurasi ini.
forecast_horizon_hours: 1
lag_hours: [3, 2, 1]

meteorological_variables:
  - temperature_2m
  - relative_humidity_2m
  - rain
  - wind_speed_100m

scenarios:
  scenario_1:
    label: Lag polutan
    include_pollutant_lags: true
    include_meteorological_lags: false
  scenario_2:
    label: Lag polutan dan meteorologi
    include_pollutant_lags: true
    include_meteorological_lags: true
